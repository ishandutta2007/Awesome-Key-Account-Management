<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .floating-card {
      animation: float 6s ease-in-out infinite alternate;
    }
    .pulse-glow {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dash 25s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      100% { opacity: 0.7; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambience (Behind everything) -->
  <g class="pulse-glow">
    <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
    <circle cx="1050" cy="280" r="160" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
    <circle cx="650" cy="320" r="120" fill="#6366f1" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Subtle Strategic Network Nodes in Background -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="80" y1="280" x2="220" y2="240" />
    <line x1="220" y1="240" x2="350" y2="290" />
    <line x1="850" y1="80" x2="980" y2="120" />
    <line x1="980" y1="120" x2="1120" y2="70" />
    <circle cx="80" cy="280" r="4" fill="#38bdf8" opacity="0.4" />
    <circle cx="220" cy="240" r="5" fill="#818cf8" opacity="0.4" />
    <circle cx="350" cy="290" r="4" fill="#c084fc" opacity="0.4" />
    <circle cx="850" cy="80" r="4" fill="#38bdf8" opacity="0.4" />
    <circle cx="980" cy="120" r="5" fill="#818cf8" opacity="0.4" />
    <circle cx="1120" cy="70" r="4" fill="#c084fc" opacity="0.4" />
  </g>

  <!-- Dynamic Curved Strategy Flow Wave (Below foreground text) -->
  <path class="flow-line" d="M -50 310 Q 300 240 600 290 T 1250 250" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.5" />
  <path class="flow-line" d="M -50 325 Q 350 260 650 305 T 1250 270" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.25" />

  <!-- Animated Feature / Metric Pill Cards in right area -->
  <g class="floating-card" transform="translate(760, 50)">
    <!-- Pill 1: Retention & NRR -->
    <rect x="0" y="0" width="370" height="64" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="34" cy="32" r="16" fill="rgba(56, 189, 248, 0.15)" />
    <path d="M 28 34 L 32 38 L 41 27" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Net Revenue Retention (NRR)</text>
    <text x="64" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Expansion • Health Scoring • Whitespace</text>

    <!-- Pill 2: Org Relationship Mapping -->
    <rect x="25" y="80" width="370" height="64" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="59" cy="112" r="16" fill="rgba(129, 140, 248, 0.15)" />
    <path d="M 52 116 C 52 110, 56 106, 61 106 C 66 106, 70 110, 70 116 Z M 61 104 A 4 4 0 1 0 61 96 A 4 4 0 1 0 61 104 Z" fill="none" stroke="#818cf8" stroke-width="2" />
    <text x="89" y="109" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Strategic Relationship Mapping</text>
    <text x="89" y="128" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Buying Centers • Influence Grids • Stakeholders</text>

    <!-- Pill 3: Enterprise & Open Source -->
    <rect x="0" y="160" width="370" height="64" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="34" cy="192" r="16" fill="rgba(192, 132, 252, 0.15)" />
    <path d="M 27 192 L 41 192 M 34 185 L 41 192 L 34 199" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="189" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Open Source &amp; Enterprise SaaS</text>
    <text x="64" y="208" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Self-Hosted Tools • Data Sovereignty • APM</text>
  </g>

  <!-- FOREGROUND BRANDING CONTENT (Guaranteed high visibility and contrast) -->
  <g transform="translate(80, 72)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="230" height="30" rx="15" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
    <text x="28" y="20" class="badge-text">KEY ACCOUNT MANAGEMENT</text>

    <!-- Main Title -->
    <text x="0" y="82" class="title">Awesome Key Account</text>
    <text x="0" y="132" class="title" fill="url(#accentGrad)">Management (KAM)</text>

    <!-- Subtitle / Value proposition -->
    <text x="0" y="180" class="subtitle">Curated landscape of Enterprise SaaS &amp; Open-Source tools for</text>
    <text x="0" y="206" class="subtitle">account planning, buying-center mapping &amp; revenue retention.</text>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
